name: sentinel

x-api-env: &api-env
  env_file:
    - .env

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  api:
    <<: *api-env
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@db:5432/${POSTGRES_DB:-sentinel}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "cd /app/apps/api && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"]
    restart: unless-stopped

  worker:
    <<: *api-env
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@db:5432/${POSTGRES_DB:-sentinel}
      REDIS_URL: redis://redis:6379/0
      C_FORCE_ROOT: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "cd /app/apps/api && celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=2 --beat"]
    healthcheck:
      disable: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: production
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  # ── Local PHP2Shell test lab (profiles: ["lab"]) ─────────────────────────
  # Private, local-only simulated targets for offline verification and
  # remediation testing. Never publish these ports to the internet.
  lab-vulnerable:
    profiles: ["lab"]
    build: tests/labs/php2shell/vulnerable
    ports: ["8081:80"]

  lab-patched:
    profiles: ["lab"]
    build: tests/labs/php2shell/patched
    ports: ["8082:80"]

  lab-hidden-version:
    profiles: ["lab"]
    build: tests/labs/php2shell/hidden-version
    ports: ["8083:80"]

  lab-phpinfo-enabled:
    profiles: ["lab"]
    build: tests/labs/php2shell/phpinfo-enabled
    ports: ["8084:80"]

  lab-phpinfo-disabled:
    profiles: ["lab"]
    build: tests/labs/php2shell/phpinfo-disabled
    ports: ["8085:80"]

  lab-vendor-backport:
    profiles: ["lab"]
    build: tests/labs/php2shell/vendor-backport
    ports: ["8086:80"]

volumes:
  db_data:
