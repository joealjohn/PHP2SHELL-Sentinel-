name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    name: Lint + typecheck + package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages + tools
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/shared ./packages/vulnerability-db ./packages/scanner
          pip install -r apps/api/requirements.txt
          pip install ruff mypy pytest pytest-timeout
      - name: Ruff
        run: ruff check .
      - name: mypy (packages)
        run: mypy packages/shared/src packages/vulnerability-db/loader/src packages/scanner/src
      - name: Package tests
        run: pytest packages/shared/tests packages/vulnerability-db/tests packages/scanner/tests -q

  api:
    name: API tests (sqlite)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///./test_api.db
      SCAN_ALLOW_PRIVATE_TARGETS: "1"
      SMTP_HOST: mailpit.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ./packages/shared ./packages/vulnerability-db ./packages/scanner
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-timeout
      - name: API tests
        working-directory: apps/api
        run: pytest tests -q

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/web
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [packages, api]
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
      - name: Build lab images
        run: |
          for d in tests/labs/php2shell/*/; do
            docker build -t "lab-$(basename "$d")" "$d"
          done
