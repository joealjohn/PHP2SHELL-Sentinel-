server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 'Contact: mailto:security@vendor-backport.lab.invalid
Policy: http://vendor-backport.lab.invalid/security-policy
';
    }
    location = /security.txt { return 404; }
    location = /phpinfo.php {
        return 404;
    }
    add_header X-Powered-By "PHP/8.4.26+dist-backport1" always;
}

    add_header Server "dist-nginx-backport/1.0" always;
