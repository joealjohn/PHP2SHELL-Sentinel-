server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 'Contact: mailto:security@hidden-version.lab.invalid
Policy: http://hidden-version.lab.invalid/security-policy
';
    }
    location = /security.txt { return 404; }
    location = /phpinfo.php {
        return 404;
    }
    add_header X-Powered-By "PHP" always;
}

