server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /.well-known/security.txt {
        default_type text/plain;
        return 200 'Contact: mailto:security@phpinfo-enabled.lab.invalid
Policy: http://phpinfo-enabled.lab.invalid/security-policy
';
    }
    location = /security.txt { return 404; }
    location = /phpinfo.php {
        default_type text/html;
        return 200 '<html><title>phpinfo()</title><h1>PHP Version 8.4.26</h1></html>';
    }
}
